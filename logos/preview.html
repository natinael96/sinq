<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sinq ስንቅ — icon concepts</title>
<style>
:root{--bg:#15171a;--panel:#1e2126;--line:#33383f;--txt:#EFEDE2}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:28px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:34px 0 14px;opacity:.8;font-weight:600}
p.sub{margin:0 0 24px;opacity:.6;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{display:flex;justify-content:center;margin-bottom:14px}
.hero .ico{width:220px;height:220px;border-radius:18%}
.row{display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mask{width:80px;height:80px;overflow:hidden;position:relative;flex:none}
.mask .ico{position:absolute;left:-16.6%;top:-16.6%;width:133.3%;height:133.3%}
.circle{border-radius:50%}.squircle{border-radius:26%}.rsquare{border-radius:15%}
.teardrop{border-radius:50% 50% 50% 10%}
.fin{width:96px;height:96px}
.stamp{background:#EFEDE2}
.lock{margin-top:12px;background:#0E3B31;border-radius:10px;overflow:hidden}
.lock .ico{width:100%;height:auto;display:block}
figcaption{text-align:center;font-size:12.5px;opacity:.75;margin-top:10px}
</style></head><body>
