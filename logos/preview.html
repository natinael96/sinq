<head>
<meta charset="UTF-8">

<title>Sinq Logo — Line Weight Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem;
    transition: background-color 0.3s, color 0.3s;
  }
  body.light { background: #f5f5f5; color: #333; }
  body.dark { background: #1a1a1a; color: #eee; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  h1 { font-size: 1.5rem; font-weight: 600; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 2.5rem 0 1rem; }
  .toggle {
    padding: 0.5rem 1rem; border: 1px solid currentColor; border-radius: 6px;
    background: transparent; color: inherit; cursor: pointer; font-size: 0.875rem;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
  .card { border: 1px solid rgba(128,128,128,0.3); border-radius: 12px; overflow: hidden; }
  .card-img { display: flex; align-items: center; justify-content: center; padding: 2rem; min-height: 240px; }
  body.light .card-img { background: #fff; }
  body.dark .card-img { background: #2a2a2a; }
  .card-img svg { width: 200px; height: 200px; border-radius: 40px; }
  .card-label { padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 500; border-top: 1px solid rgba(128,128,128,0.3); }
  .card-label small { display: block; font-weight: 400; opacity: 0.65; margin-top: 2px; }
  body.light .card-label { background: #fafafa; }
  body.dark .card-label { background: #222; }
  .sizes { display: flex; gap: 2.5rem; flex-wrap: wrap; align-items: end; }
  .size-col { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .size-col .name { font-size: 0.8rem; font-weight: 500; }
  .size-row { display: flex; gap: 1rem; align-items: end; }
  .size-cell { text-align: center; }
  .size-cell .px { font-size: 0.7rem; opacity: 0.6; margin-top: 3px; }
  .size-cell svg { border-radius: 22%; display: block; }
</style>
